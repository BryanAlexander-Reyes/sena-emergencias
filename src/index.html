<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>SENA Crowd Intelligence</title>

    <base href="/" />

    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#F5F6F1" />
    <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />

    <link rel="icon" type="image/png" href="assets/icon/favicon.png" />

    <!-- add to homescreen for ios -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- UIX.2: splash crítico. Se pinta con el primer byte, sin JS ni hojas externas. -->
    <style>
      html,
      body {
        margin: 0;
        background: #f5f6f1;
        color: #202824;
      }
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px)
          env(safe-area-inset-left, 0px);
        background: #f5f6f1;
        color: #153d32;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          Arial,
          sans-serif;
        text-align: center;
        transition:
          opacity 200ms ease,
          visibility 0s linear 200ms;
      }
      #app-splash[data-ready='true'] {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .app-splash__mark {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 76px;
        height: 76px;
        border-radius: 22px;
        background: #153d32;
        box-shadow: 0 12px 32px rgba(21, 61, 50, 0.18);
      }
      .app-splash__mark svg {
        width: 42px;
        height: 42px;
      }
      .app-splash__title,
      .app-splash__subtitle {
        margin: 0;
      }
      .app-splash__title {
        font-size: 1.05rem;
        font-weight: 800;
        letter-spacing: 0.08em;
      }
      .app-splash__subtitle {
        margin-top: 6px;
        color: #3c6e63;
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }
      .app-splash__bar {
        width: 160px;
        height: 4px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(32, 40, 36, 0.1);
      }
      .app-splash__bar::after {
        content: '';
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 999px;
        background: #39a86b;
        animation: app-splash-slide 1.1s ease-in-out infinite;
      }
      @keyframes app-splash-slide {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(350%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-splash {
          transition: none;
        }
        .app-splash__bar::after {
          width: 100%;
          animation: none;
        }
      }
    </style>
  </head>

  <body>
    <div id="app-splash" role="status" aria-live="polite" aria-label="Iniciando SENA Crowd Intelligence">
      <div class="app-splash__mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path
            d="M6 11V8a2 2 0 0 1 2-2h3M21 6h3a2 2 0 0 1 2 2v3M26 21v3a2 2 0 0 1-2 2h-3M11 26H8a2 2 0 0 1-2-2v-3"
            stroke="#39a86b"
            stroke-width="2"
            stroke-linecap="round"
          />
          <circle cx="16" cy="16" r="3.5" fill="#e9b44c" />
        </svg>
      </div>
      <div>
        <p class="app-splash__title">SENA CROWD INTELLIGENCE</p>
        <p class="app-splash__subtitle">Monitoreo inteligente</p>
      </div>
      <div class="app-splash__bar" aria-hidden="true"></div>
    </div>

    <app-root></app-root>
  </body>
</html>
